<style>
  :root{

    --clay: #c97a4a; --clay-light:#e0946a;

  .wrap{ max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; padding:6px 2px 22px; border-bottom:1px solid var(--line); margin-bottom:20px; gap:10px; }

<script>
// ============================================================
// إعداد Firebase — الصق بيانات مشروعك من Firebase Console هنا
// (يجب أن تكون مطابقة تمامًا لما وضعته في ملف حجز-الملاعب.html)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAATE8FjT-Pg2G1lqNlqDEajdqiZY1EGdk",
  authDomain: "malaeb-shaabiya.firebaseapp.com",
  projectId: "malaeb-shaabiya",
  storageBucket: "malaeb-shaabiya.firebasestorage.app",
  messagingSenderId: "186784756749",
  appId: "1:186784756749:web:c382ebd1dccc8a26b85144"
};
firebase.initializeApp(firebaseConfig);
const _db = firebase.firestore();
// تفعيل العمل بدون إنترنت: نفس السلوك بالضبط الموجود بملف الحجز —
// نسخة محلية بالجهاز تُعرض فورًا، وتُزامن تلقائيًا عند عودة الاتصال.
try{ _db.enablePersistence({ synchronizeTabs:true }).catch(()=>{}); }catch(e){}
const _COLLECTION = 'app_data';

function watchDoc(key, cb){
  return _db.collection(_COLLECTION).doc(key).onSnapshot(
    doc => cb(doc.exists ? doc.data().value : null),
    err => console.warn('watchDoc error', err)
  );
}
function watchPrefix(prefix, cb){
  let q = _db.collection(_COLLECTION);
  if(prefix){ q = q.where(firebase.firestore.FieldPath.documentId(), '>=', prefix).where(firebase.firestore.FieldPath.documentId(), '<', prefix+'\uf8ff'); }
  return q.onSnapshot(
    snap => cb(snap.docs.map(d=>({ key:d.id, value:d.data().value }))),
    err => console.warn('watchPrefix error', err)
  );
}
let _activeUnsubs = [];
function _clearWatchers(){ _activeUnsubs.forEach(u=>{ try{ u(); }catch(e){} }); _activeUnsubs = []; }

window.addEventListener('offline', ()=> showToast('غير متصل بالإنترنت — اللوحة تعمل من آخر بيانات محفوظة وستُزامن تلقائيًا عند عودة الاتصال'));
window.addEventListener('online', ()=> showToast('تم الاتصال بالإنترنت — جاري المزامنة...'));

// ==== الأصوات والإشعارات ====
function requestNotifyPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
}
function playSound(url){
  try{ const audio = new Audio(url); audio.play().catch(()=>{}); }catch(e){}
}
async function showNotification(title, body){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, { body, icon:'admin-icon-192.png', badge:'admin-favicon-32.png', vibrate:[200,100,200] });
    } else {
      new Notification(title, { body, icon:'admin-icon-192.png' });
    }
  }catch(e){}
}

// ==== إشعارات حقيقية (Push) عبر Firebase Cloud Messaging ====
// الصق مفتاح VAPID من Firebase Console ← Project settings ← Cloud Messaging
// (نفس المفتاح المستخدم بملف الحجز)
const VAPID_KEY = "ضع_VAPID_KEY_هنا";
let _messaging = null;
try{ _messaging = firebase.messaging(); }catch(e){}

async function registerFcmToken(){
  if(!_messaging) return;
  try{
    if(!('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.ready;
    const token = await _messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return;
    await setJson(`fcm-tokens:admin:${token}`, { token, updatedAt: Date.now() }, true);
  }catch(e){ console.warn('FCM token error', e); }
}
// ملاحظة: لا نعالج رسائل FCM هنا وقت فتح اللوحة (foreground) عمدًا —
// المراقبة الحية عبر Firestore (أعلى الملف) أسرع وتشغّل صفارة الحكم
// مباشرة طالما اللوحة شغّالة، والـ Service Worker (admin-sw.js) هو من
// يتكفل بعرض الإشعار فقط لو اللوحة مقفولة تمامًا.

// مراقبة عامة مستمرة بمعزل عن أي تبويب: تكتشف أي حجز جديد (بانتظار
// المطابقة أو عادي مؤكد فورًا) وتصدر صفارة الحكم مع إشعار خارج التطبيق.
let _globalBookingWatchUnsub = null;
let _knownBookingKeys = null;
function startGlobalBookingWatch(){
  if(_globalBookingWatchUnsub) return;
  _globalBookingWatchUnsub = watchPrefix('booking:', (items)=>{
    const currentKeys = new Set(items.map(it=>it.key));
    if(_knownBookingKeys===null){ _knownBookingKeys = currentKeys; return; } // أول تحميل: لا تنبيه، فقط تسجيل الموجود حاليًا
    items.forEach(it=>{
      if(_knownBookingKeys.has(it.key)) return;
      let val; try{ val = JSON.parse(it.value); }catch(e){ return; }
      if(!val) return;
      if(val.status==='awaiting_sms'){
        playSound('whistle.mp3');
        showNotification('حجز جديد بانتظار المراجعة', `${val.name} · ${val.date} · ${formatTime12(val.time)}`);
      } else if(val.status==='confirmed' && val.bookingType==='normal'){
        playSound('whistle.mp3');
        showNotification('حجز عادي جديد', `${val.name} · ${val.date} · ${formatTime12(val.time)}`);
      }
    });
    _knownBookingKeys = currentKeys;
  });
}

// شبيه (shim) لواجهة window.storage الأصلية، لكن مبني على Firestore
// بدل تخزين Claude — بقية الكود لا يحتاج أي تعديل لأنه يستخدم نفس الواجهة.
window.storage = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem('local:'+key);
      return v ? { key, value:v, shared:false } : null;
    }
    const doc = await _db.collection(_COLLECTION).doc(key).get();
    return doc.exists ? { key, value: doc.data().value, shared:true } : null;
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem('local:'+key, value);
      return { key, value, shared:false };
    }
    await _db.collection(_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared:true };
  },
  async delete(key, shared){
    if(!shared){
      localStorage.removeItem('local:'+key);
      return { key, deleted:true, shared:false };
    }
    await _db.collection(_COLLECTION).doc(key).delete();
    return { key, deleted:true, shared:true };
  },
  async list(prefix, shared){
    if(!shared){
      const keys = []; const p = 'local:'+(prefix||'');
      for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(p)===0) keys.push(k.slice(6)); }
      return { keys, prefix, shared:false };
    }
    let q = _db.collection(_COLLECTION);
    if(prefix){ q = q.where(firebase.firestore.FieldPath.documentId(), '>=', prefix).where(firebase.firestore.FieldPath.documentId(), '<', prefix+'\uf8ff'); }
    const snap = await q.get();
    return { keys: snap.docs.map(d=>d.id), prefix, shared:true };
  }
};
// ============================================================
// نهاية إعداد Firebase — كل ما يلي هو نفس منطق التطبيق الأصلي
// ============================================================

const DEFAULT_COURTS = [
  { id:'c1', name:'ملعب النجوم', area:'حي الزهور', price:60, closed:false },
  { id:'c2', name:'ملعب الوادي', area:'شارع الجامعة', price:50, closed:false },
  { id:'c3', name:'ملعب الشباب', area:'حي السلام', price:70, closed:false },
  { id:'c4', name:'ملعب الحارة', area:'خلف السوق القديم', price:45, closed:false },
];
let COURTS = [];

function localDateStr(d){
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysSinceDate(dateStr){
  const parts = dateStr.split('-').map(Number);
  const then = new Date(parts[0], parts[1]-1, parts[2]);
  const now = new Date();
  const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((nowMidnight - then) / 86400000);
}
async function getLicense(){
  const lic = await getJson('license:info', true);
  if(!lic) return { adminCode:'admin2026', renewedDate: localDateStr(), active:true, daysLeft:30 };
  const daysElapsed = daysSinceDate(lic.renewedDate);
  const daysLeft = lic.active===false ? 0 : Math.max(0, 30 - daysElapsed);
  return { ...lic, daysLeft };
}

let state = { view:'adminLogin', tab:'bookings' };

function accountKey(phone){ return `account:${phone}`; }
async function getJson(key, shared){ try{ const r = await window.storage.get(key, shared); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function setJson(key, val, shared){ try{ return await window.storage.set(key, JSON.stringify(val), shared); }catch(e){ return null; } }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

async function loadCourts(){
  let courts = await getJson('config:courts', true);
  if(!courts){ courts = DEFAULT_COURTS; await setJson('config:courts', courts, true); }
  return courts;
}
async function saveCourts(courts){ await setJson('config:courts', courts, true); }

function hourLabel12(h){
  if(h===0) return '12:00 منتصف الليل';
  if(h<12) return `${h}:00 صباحًا`;
  if(h===12) return '12:00 ظهرًا';
  return `${h-12}:00 مساءً`;
}
function formatTime12(hhmm){
  const h = parseInt((hhmm||'0:0').split(':')[0], 10) || 0;
  return hourLabel12(h);
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

const DAY_NAMES = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TIMES = Array.from({length:24}, (_,h)=>({ v: String(h).padStart(2,'0')+':00', l: hourLabel12(h) }));

async function loadRecurringForPhone(phone){
  try{
    const all = await window.storage.list('recurring:', true);
    const keys = (all && all.keys) ? all.keys : [];
    const items = [];
    await Promise.all(keys.map(async k=>{ const val = await getJson(k, true); if(val && val.phone===phone) items.push({key:k, ...val}); }));
    items.sort((a,b)=> a.dow - b.dow || a.time.localeCompare(b.time));
    return items;
  }catch(e){ return []; }
}

function checkedValues(attr, phone){
  return Array.from(document.querySelectorAll(`input[${attr}]`))
    .filter(el => el.getAttribute(attr) === phone && el.checked)
    .map(el => el.value);
}

async function removeRecurring(key){
  try{ await window.storage.delete(key, true); showToast('تم إلغاء الحجز الخاص'); await renderAdminAccounts(); }
  catch(e){ showToast('حدث خطأ، حاول مرة أخرى'); }
}

function extractRefAndAmount(smsText, settings){
  let ref = '';
  if(settings.smsRefKeyword){
    const re = new RegExp(escapeRegex(settings.smsRefKeyword) + '\\s*[:\\-]?\\s*([A-Za-z0-9]+)', 'i');
    const m = smsText.match(re);
    if(m) ref = m[1];
  }
  if(!ref){
    const tokens = smsText.match(/[A-Za-z0-9]{4,}/g) || [];
    ref = tokens.sort((a,b)=>b.length-a.length)[0] || '';
  }
  let amount = null;
  if(settings.smsAmountKeyword){
    const re2 = new RegExp(escapeRegex(settings.smsAmountKeyword) + '\\s*[:\\-]?\\s*([\\d,]+(?:\\.\\d+)?)', 'i');
    const m2 = smsText.match(re2);
    if(m2) amount = parseFloat(m2[1].replace(/,/g,''));
  }
  if(amount===null){
    const m3 = smsText.match(/\d+(?:[.,]\d+)?/);
    if(m3) amount = parseFloat(m3[0].replace(/,/g,''));
  }
  const last4 = ref.slice(-4).toUpperCase();
  return { ref, last4, amount };
}

async function matchAndConfirm(parsed){
  if(!parsed.last4 || parsed.amount===null) return { matched:false };
  const all = await window.storage.list('booking:', true);
  const keys = (all && all.keys) ? all.keys : [];
  const candidates = [];
  await Promise.all(keys.map(async k=>{
    const val = await getJson(k, true);
    if(val && val.status==='awaiting_sms') candidates.push({key:k, ...val});
  }));
  candidates.sort((a,b)=>a.createdAt-b.createdAt);
  const match = candidates.find(b => b.last4Ref===parsed.last4 && Math.abs(Number(b.depositAmount)-parsed.amount) < 0.01);
  if(!match) return { matched:false };
  match.status = 'confirmed';
  await setJson(match.key, match, true);
  return { matched:true, booking: match };
}

async function logSms(smsText, parsed, result){
  try{
    const key = `sms-log:${Date.now()}`;
    await setJson(key, { text: smsText.slice(0,300), last4: parsed.last4, amount: parsed.amount, matched: !!result.matched, bookingName: result.booking ? result.booking.name : null, at: Date.now() }, true);
  }catch(e){}
}

async function handleIncomingSms(smsText, token, sender){
  const app = document.getElementById('app');
  const lic = await getLicense();
  if(lic.active===false || lic.daysLeft<=0){
    app.innerHTML = `<div class="empty">انتهى اشتراك لوحة المشرف — لا يمكن معالجة الرسائل حاليًا</div>`;
    return;
  }
  const settings = await getJson('config:settings', true) || {};
  if(!settings.smsToken || token !== settings.smsToken){
    app.innerHTML = `<div class="empty">رمز غير صحيح</div>`;
    return;
  }
  if(settings.smsSenderName && settings.smsSenderName.trim()){
    const expected = settings.smsSenderName.trim().toLowerCase();
    const got = (sender||'').trim().toLowerCase();
    if(!got || !got.includes(expected)){
      app.innerHTML = `
        <div style="padding:50px 20px; text-align:center;">
          <div style="font-size:44px; margin-bottom:12px;">🚫</div>
          <div style="font-family:'Almarai'; font-weight:700; font-size:16px; margin-bottom:8px;">تم تجاهل الرسالة</div>
          <div style="font-size:12.5px; opacity:.55;">اسم المرسل "${sender||'غير محدد'}" لا يطابق اسم البنك المُعتمد بالإعدادات</div>
        </div>`;
      return;
    }
  }
  const parsed = extractRefAndAmount(smsText, settings);
  const result = await matchAndConfirm(parsed);
  await logSms(smsText, parsed, result);
  app.innerHTML = `
    <div style="padding:50px 20px; text-align:center;">
      <div style="font-size:44px; margin-bottom:12px;">${result.matched?'✅':'⚠️'}</div>
      <div style="font-family:'Almarai'; font-weight:700; font-size:16px; margin-bottom:8px;">${result.matched?`تم تأكيد حجز ${result.booking.name}`:'لم يتم العثور على حجز مطابق'}</div>
      <div style="font-size:12.5px; opacity:.55;">آخر 4: ${parsed.last4||'-'} · المبلغ المستخرج: ${parsed.amount!==null?parsed.amount:'-'}</div>
    </div>`;
}

let _licenseWatchUnsub = null;
function startLicenseWatch(){
  if(_licenseWatchUnsub) return;
  _licenseWatchUnsub = watchDoc('license:info', (value)=>{
    let lic; try{ lic = value ? JSON.parse(value) : null; }catch(e){ lic = null; }
    if(!lic) return;
    const daysLeft = lic.active===false ? 0 : Math.max(0, 30 - daysSinceDate(lic.renewedDate));
    paintLicenseBadge(daysLeft);
    if(lic.active===false || daysLeft<=0){ showExpiredLock(); }
  });
  // فحص فوري عند البدء + كل ساعة (لأن اليوم يتغيّر مع الوقت حتى بدون أي كتابة جديدة بقاعدة البيانات)
  const check = async ()=>{
    const lic = await getLicense();
    paintLicenseBadge(lic.daysLeft);
    if(lic.active===false || lic.daysLeft<=0){ showExpiredLock(); }
  };
  check();
  if(_licenseCheckTimer) clearInterval(_licenseCheckTimer);
  _licenseCheckTimer = setInterval(check, 300000);
}

          <div class="row1">
            <div><b>${a.name}</b><br><span class="phone">${a.phone}</span></div>
            ${a.status==='normal' ? `<span class="badge normal">حجز عادي</span>` : `<span class="badge provisional">حجز مبدئي</span>`}
          </div>
          <div class="row2">
            <button class="toggle-btn ${a.status==='provisional'?'is-active':''}" onclick="setAccountStatus('${a.phone}','provisional')">مبدئي</button>
            <button class="toggle-btn ${a.status==='normal'?'is-active':''}" onclick="setAccountStatus('${a.phone}','normal')">عادي</button>
            <button class="del-btn" onclick="deleteAccount('${a.phone}')">حذف</button>
          </div>
          ${recSummary}
          ${hasRecurring
            ? `<button class="btn" style="margin-top:8px; background:none; border:1px solid var(--danger); color:var(--danger);" onclick="cancelAllRecurring('${a.phone}')">إلغاء الحجز الخاص</button>`
            : `<button class="btn admin-primary" style="margin-top:8px;" onclick="toggleRecPanel('${a.phone}')">إضافة حجز خاص</button>`
          }
          <div id="recPanel-${a.phone}" style="display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:12px;">
            <div class="settings-note" style="font-weight:700;">اختر ملعبًا واحدًا</div>
            <select id="recCourt-${a.phone}" style="width:100%; margin-top:6px; background:var(--night-2); color:var(--chalk); border:1px solid var(--line); border-radius:8px; padding:9px;">
              ${COURTS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
            <div class="settings-note" style="font-weight:700; margin-top:12px;">اختر يومًا وحدّد ساعته ونوع التكرار (يمكنك اختيار أكثر من يوم، ولكل يوم إعداداته الخاصة)</div>
            ${DAY_NAMES.map((d,i)=>`
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px; background:var(--night-2); padding:8px; border-radius:8px;">
                <label class="chk" style="background:none; padding:0; flex-shrink:0;"><input type="checkbox" data-rec-dow="${a.phone}" value="${i}" onchange="toggleDayTimeSelect('${a.phone}', ${i})"> ${d}</label>
                <select id="recTime-${a.phone}-${i}" disabled style="flex:1; min-width:100px; background:var(--night); color:var(--chalk); border:1px solid var(--line); border-radius:6px; padding:6px;">
                  ${TIMES.map(t=>`<option value="${t.v}">${t.l}</option>`).join('')}
                </select>
                <select id="recMode-${a.phone}-${i}" disabled style="flex:1; min-width:90px; background:var(--night); color:var(--chalk); border:1px solid var(--line); border-radius:6px; padding:6px;">
                  <option value="always">دائم (كل أسبوع)</option>
                  <option value="once">مرة واحدة فقط</option>
                </select>
              </div>`).join('')}
            <button class="btn admin-primary" style="margin-top:12px;" onclick="confirmRecurring('${a.phone}')">تم الاختيار</button>
          </div>
        </div>`;
      }).join('');
}

function toggleDayTimeSelect(phone, dow){
  const checkbox = document.querySelector(`input[data-rec-dow="${phone}"][value="${dow}"]`);
  const timeSel = document.getElementById(`recTime-${phone}-${dow}`);
  const modeSel = document.getElementById(`recMode-${phone}-${dow}`);
  const enabled = !!(checkbox && checkbox.checked);
  if(timeSel) timeSel.disabled = !enabled;
  if(modeSel) modeSel.disabled = !enabled;
}

// تاريخ أقرب موعد قادم لهذا اليوم من الأسبوع (لو اليوم نفسه، يرجع تاريخ اليوم)
function nextDateForDow(dow){
  const now = new Date();
  const diff = (dow - now.getDay() + 7) % 7;
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
}

async function addNewAccount(){
  const nameEl = document.getElementById('newAccName');
  const phoneEl = document.getElementById('newAccPhone');
  const errEl = document.getElementById('newAccErr');
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  errEl.style.display = 'none';
  if(!name || !phone){ showToast('اكتب الاسم ورقم الهاتف'); return; }
  const existing = await getJson(accountKey(phone), true);
  if(existing){ errEl.style.display = 'block'; return; }
  await setJson(accountKey(phone), { phone, name, status:'provisional', createdAt: Date.now() }, true);
  showToast('تم إضافة الحساب بنجاح');
  await renderAdminAccounts();
}

function toggleRecPanel(phone){
  const panel = document.getElementById(`recPanel-${phone}`);
  if(panel) panel.style.display = panel.style.display==='none' ? 'block' : 'none';
}

async function confirmRecurring(phone){
  const courtId = document.getElementById(`recCourt-${phone}`).value;
  const dows = checkedValues('data-rec-dow', phone).map(Number);
  if(dows.length===0){ showToast('اختر يومًا واحدًا على الأقل'); return; }
  const acc = await getJson(accountKey(phone), true);
  if(!acc){ showToast('تعذّر إيجاد الحساب'); return; }
  let added = 0; const conflicts = [];
  for(const dow of dows){
    const timeEl = document.getElementById(`recTime-${phone}-${dow}`);
    const modeEl = document.getElementById(`recMode-${phone}-${dow}`);
    const time = timeEl ? timeEl.value : null;
    const mode = modeEl ? modeEl.value : 'always';
    if(!time) continue;
    if(mode==='once'){
      const date = nextDateForDow(dow);
      const recExisting = await getJson(`recurring:${courtId}:${dow}:${time}`, true);
      if(recExisting && recExisting.phone !== phone){
        conflicts.push(`${DAY_NAMES[dow]} ${formatTime12(time)} (محجوز حجزًا دائمًا لـ ${recExisting.name})`);
        continue;
      }
      const bKey = `booking:${courtId}:${date}:${time}`;
      const bExisting = await getJson(bKey, true);
      if(bExisting){
        conflicts.push(`${DAY_NAMES[dow]} ${formatTime12(time)} (الموعد بتاريخ ${date} محجوز بالفعل)`);
        continue;
      }
      await setJson(bKey, { courtId, date, time, phone, name:acc.name, bookingType:'private', status:'confirmed', createdAt: Date.now() }, true);
      added++;
    } else {
      const key = `recurring:${courtId}:${dow}:${time}`;
      const existing = await getJson(key, true);
      if(existing && existing.phone !== phone){
        conflicts.push(`${DAY_NAMES[dow]} ${formatTime12(time)} (محجوز لـ ${existing.name})`);
        continue;
      }
      await setJson(key, { phone, name:acc.name, courtId, dow, time, createdAt: Date.now() }, true);
      added++;
    }
  }
  if(added>0){ showToast(`تم تأكيد الحجز الخاص ✓ (${added})` + (conflicts.length ? ` — تعذّر: ${conflicts.join('، ')}` : '')); }
  else{ showToast(`لم يتم التفعيل — ${conflicts.join('، ')}`); }
  await renderAdminAccounts();
}

async function cancelAllRecurring(phone){
  try{
    const recs = await loadRecurringForPhone(phone);
    await Promise.all(recs.map(r=>window.storage.delete(r.key, true)));
    showToast('تم إلغاء الحجز الخاص بالكامل لهذا الحساب');
    await renderAdminAccounts();
  }catch(e){ showToast('حدث خطأ، حاول مرة أخرى'); }
}

async function setAccountStatus(phone, status){
  try{
    const acc = await getJson(accountKey(phone), true);
    if(!acc) return;
    acc.status = status;
    await setJson(accountKey(phone), acc, true);
    showToast(status==='normal' ? 'تم تحويل الحساب لحجز عادي' : 'تم تحويل الحساب لحجز مبدئي');
    await renderAdminAccounts();
  }catch(e){ showToast('حدث خطأ، حاول مرة أخرى'); }
}

async function deleteAccount(phone){
  try{
    await window.storage.delete(accountKey(phone), true);
    showToast('تم حذف الحساب. سيحتاج المستخدم إلى التسجيل من جديد وسيبدأ بحجز مبدئي');
    await renderAdminAccounts();
  }catch(e){ showToast('حدث خطأ، حاول مرة أخرى'); }
}

  const logs = await loadSmsLog();
  body.innerHTML = `

    <div class="field"><label>طريقة تحويل إضافية ١ - الرقم</label><input type="text" id="setExtra1Value" value="${s.extraValue1||''}" style="direction:ltr; text-align:right;"></div>
    <div class="field"><label>طريقة تحويل إضافية ٢ - الاسم (اختياري)</label><input type="text" id="setExtra2Label" value="${s.extraLabel2||''}" placeholder="مثال: تحويل عبر تطبيق آخر"></div>
    <div class="field"><label>طريقة تحويل إضافية ٢ - الرقم</label><input type="text" id="setExtra2Value" value="${s.extraValue2||''}" style="direction:ltr; text-align:right;"></div>
    <button class="btn admin-primary" onclick="saveSettings()">حفظ الإعدادات</button>
    <div class="settings-note">هذه البيانات هي التي تظهر للمستخدم صاحب "الحجز المبدئي" ليحوّل عليها. بمجرد أن تصل رسالة البنك ويتم مطابقتها تلقائيًا، يتأكد الحجز فورًا دون أي انتظار.</div>

    <div class="section-title" style="margin-top:32px;">المطابقة التلقائية عبر رسائل البنك</div>
    <div class="field"><label>رمز سري لحماية رابط استقبال الرسائل</label><input type="text" id="setSmsToken" value="${s.smsToken||''}" style="direction:ltr; text-align:right;" placeholder="مثال: a7f92k"></div>
    <button class="btn admin-primary" style="margin-bottom:14px;" type="button" onclick="generateSmsToken()">توليد رمز عشوائي جديد</button>
    <div class="field"><label>اسم جهة الإرسال بالضبط كما يظهر برسائل البنك (اختياري لكن يُنصح به)</label><input type="text" id="setSmsSenderName" value="${s.smsSenderName||''}" placeholder="مثال: Med Bank"></div>
    <div class="field"><label>كلمة تسبق رقم عملية التحويل في رسالة البنك (اختياري)</label><input type="text" id="setSmsRefKeyword" value="${s.smsRefKeyword||''}" placeholder="مثال: رقم المعاملة"></div>
    <div class="field"><label>كلمة تسبق المبلغ في رسالة البنك (اختياري)</label><input type="text" id="setSmsAmountKeyword" value="${s.smsAmountKeyword||''}" placeholder="مثال: ايداع"></div>
    <button class="btn admin-primary" onclick="saveSettings()">حفظ إعدادات الرسائل</button>
    <div class="settings-note">اسم جهة الإرسال يمنع معالجة أي رسالة لا تأتي فعليًا من البنك (حتى لو حصل أحد على الرابط بالخطأ). أما الكلمتين الأخريين فاتركهما فارغتين لو غير متأكد — النظام يحاول استخراج رقم العملية والمبلغ تلقائيًا، لكن تحديدهما يرفع دقة المطابقة بشكل كبير.</div>

    <div class="field" style="margin-top:18px;">
      <label>رابط استقبال الرسائل (يُستخدم في تطبيق مثل MacroDroid على جهاز المشرف)</label>

async function loadSmsLog(){
  try{
    const all = await window.storage.list('sms-log:', true);
    const keys = (all && all.keys) ? all.keys : [];
    const logs = [];
    await Promise.all(keys.map(async k=>{ const val = await getJson(k, true); if(val) logs.push(val); }));
    logs.sort((a,b)=>b.at-a.at);
    return logs.slice(0,15);
  }catch(e){ return []; }
}

async function clearSmsLog(){
  try{
    const all = await window.storage.list('sms-log:', true);
    const keys = (all && all.keys) ? all.keys : [];
    await Promise.all(keys.map(k=>window.storage.delete(k, true)));
    showToast('تم مسح سجل الرسائل');
    await renderSettings();
  }catch(e){ showToast('حدث خطأ، حاول مرة أخرى'); }
}

function generateSmsToken(){
  const token = Math.random().toString(36).slice(2,10);
  document.getElementById('setSmsToken').value = token;
}

async function copyWebhookUrl(){
  const box = document.getElementById('webhookUrlBox');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(box.value); }
    else { box.removeAttribute('readonly'); box.focus(); box.select(); document.execCommand('copy'); box.setAttribute('readonly',''); }
    showToast('تم نسخ الرابط ✓');
  }catch(e){ showToast('تعذر النسخ، انسخه يدويًا'); }
}

async function saveSettings(){
  const settings = {
    depositAmount: Number(document.getElementById('setDeposit').value) || 0,
    bankName: document.getElementById('setBank').value.trim(),
    accountHolder: document.getElementById('setHolder').value.trim(),
    accountNumber: document.getElementById('setNumber').value.trim(),
    extraLabel1: document.getElementById('setExtra1Label').value.trim(),
    extraValue1: document.getElementById('setExtra1Value').value.trim(),
    extraLabel2: document.getElementById('setExtra2Label').value.trim(),
    extraValue2: document.getElementById('setExtra2Value').value.trim(),
    smsToken: document.getElementById('setSmsToken').value.trim(),
    smsRefKeyword: document.getElementById('setSmsRefKeyword').value.trim(),
    smsSenderName: document.getElementById('setSmsSenderName').value.trim(),
    smsAmountKeyword: document.getElementById('setSmsAmountKeyword').value.trim(),
  };
  await setJson('config:settings', settings, true);
  showToast('تم حفظ الإعدادات');
}

async function boot(){
  const hasSession = await getJson('admin_session', false);
  if(hasSession){
    const lic = await getLicense();
    if(lic.active===false || lic.daysLeft<=0){
      render();
      showExpiredLock();
      return;
    }
    state.view = 'admin'; state.tab = 'bookings';
    requestNotifyPermission();
    registerFcmToken();
    startGlobalBookingWatch();
    startLicenseWatch();
  }
  render();
}

const _params = new URLSearchParams(location.search);
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('admin-sw.js').catch(()=>{}); });
}

let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  _deferredInstallPrompt = e;
  if(!localStorage.getItem('admin_install_dismissed')){
    document.getElementById('installBar').classList.add('show');
  }
});
async function installApp(){
  const bar = document.getElementById('installBar');
  bar.classList.remove('show');
  if(!_deferredInstallPrompt) return;
  _deferredInstallPrompt.prompt();
  await _deferredInstallPrompt.userChoice;
  _deferredInstallPrompt = null;
}
function dismissInstallBar(){
  document.getElementById('installBar').classList.remove('show');
  localStorage.setItem('admin_install_dismissed', '1');
}
window.addEventListener('appinstalled', ()=>{ document.getElementById('installBar').classList.remove('show'); });

if(_params.has('sms')){
  handleIncomingSms(_params.get('sms'), _params.get('token') || '', _params.get('sender') || '');
} else {
  boot();
}
</script>
